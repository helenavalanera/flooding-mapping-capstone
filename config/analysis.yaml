project: flooding-mapping

# SIRGAS 2000 / UTM 22S: métrico, cobre 54°W–48°W (Porto Alegre ≈ 51,2°W).
crs_metric: EPSG:31982
# CRS geográfico esperado pelo r5py e usado para troca de dados.
crs_geographic: EPSG:4326

time:
  # Quinta-feira típica dentro da vigência declarada do feed (ver
  # reports/qa/gtfs_validation.md). O feed está VENCIDO desde 2025-12-12:
  # referência histórica, não o serviço atual.
  data_referencia: "2025-10-30"
  # PROVISÓRIO: pico da manhã em dia útil; revisar após validar o serviço.
  horario_partida: "07:00"
  # Janela de partida (r5py departure_time_window); NÃO é duração máxima.
  janela_partida_min: 60

accessibility:
  limite_min: 30
  modos: [walk, car, transit]

grid:
  espacamento_m: 1000

scenarios:
  raios_m: [50, 100, 150]
  # PROVISÓRIO: tolerância para considerar uma aresta como intersectando a zona.
  tolerancia_m: 0

susceptibility:
  # Positivo: segmento viário a até esta distância de um bloqueio geocodificado.
  raio_positivo_m: 50
  bloco_validacao_m: 2000
  # Alerta operacional — PROVISÓRIO: limiar de chuva e fração de segmentos em alerta
  # ainda sem calibração com dados observados.
  alerta_chuva_mm_h: 30
  alerta_percentil: 0.95
  alerta_raio_m: 50

mobility:
  # Escala de chuva acumulada em 24 h (mm). Medida: população da cidade alcançável
  # em até accessibility.limite_min a partir de cada origem, por modo.
  chuva_24h_mm: [10, 20, 30, 35, 40, 45]
  # Zona de busca em torno de cada ponto que fecha (documentado ou do modelo).
  raio_m: 100
  # Pontos extras do modelo ficam a pelo menos esta distância entre si e dos documentados.
  distancia_minima_m: 500
  # Multiplica o número de pontos extras previsto pelo ajuste chuva × bloqueios:
  # 1 = condição observada; valores maiores simulam drenagem mais precária.
  fatores_precariedade: [1, 3]

robustness:
  n_pares: 500
  semente: 20261025

population:
  # PROVISÓRIO: densidade uniforme dentro do setor censitário.
  metodo_alocacao: densidade_uniforme
  excluir_origens_sem_populacao: true

osm:
  # Margem em torno do polígono municipal para o recorte do PBF.
  margem_recorte_m: 3000

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  events: data/events
  manifest: data/raw/manifest.json
  tables: outputs/tables
  maps: outputs/maps
  qa: reports/qa

sources:
  gtfs:
    # URL canônica obtida via API CKAN do portal (resource_show) em 2026-10-24.
    url: https://dadosabertos.poa.br/dataset/1fe9c2c1-9fbe-48ea-841b-61e30597ecd6/resource/b3bce61f-78ee-49eb-be57-6236d82bd5e0/download/arquivo-gtfs.zip
    url_candidata_original: https://dadosabertos.poa.br/dataset/1fe9c2c1-9fbe-48ea-841b-61e30597ecd6/resource/b3bce61f-78ee-49eb-be57-6236d82bd5e0/download/outputfiles.zip
    destino: data/raw/gtfs_eptc.zip
  osm:
    url: https://download.geofabrik.de/south-america/brazil/sul-latest.osm.pbf
    destino: data/raw/sul-latest.osm.pbf
  # Malha de setores 2022 com agregados (população) na mesma referência.
  ibge_setores:
    url: https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/setores/gpkg/UF/RS/RS_setores_CD2022.gpkg
    destino: data/raw/RS_setores_CD2022.gpkg
  # Copernicus DEM GLO-30 (DSM, inclui edificações). Tiles cobrindo -31..-29 lat, -52..-51 lon.
  dem_s30:
    url: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_S30_00_W052_00_DEM/Copernicus_DSM_COG_10_S30_00_W052_00_DEM.tif
    destino: data/raw/dem/Copernicus_DSM_COG_10_S30_00_W052_00_DEM.tif
  dem_s31:
    url: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_S31_00_W052_00_DEM/Copernicus_DSM_COG_10_S31_00_W052_00_DEM.tif
    destino: data/raw/dem/Copernicus_DSM_COG_10_S31_00_W052_00_DEM.tif
  ibge_dicionario:
    url: https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/Dicionario_de_dados_malha_agregados.xlsx
    destino: data/raw/Dicionario_de_dados_malha_agregados.xlsx

# Malha rodoviária estadual (DAER). A camada ArcGIS tem a geometria (1.683 trechos, linhas
# densas: o serviço responde 500 a uma consulta única, por isso a paginação); a planilha do
# Sistema Rodoviário Estadual traz os atributos (VDM, IRI etc.) e é baixada manualmente.
daer:
  camada_arcgis: https://iede.rs.gov.br/server/rest/services/DAER/Rodovias_RS_por_Administracao/MapServer/0
  geojson: data/raw/daer/rodovias_arcgis.geojson
  planilha: data/raw/daer/relatorio_sre.xls
  # SIRGAS 2000 / Brazil Polyconic: um CRS métrico único para todo o RS (o estado cruza
  # os fusos UTM 21S e 22S). Usado só para comprimentos e posições ao longo da linha.
  crs_metrico: EPSG:5880
  segmento_km: 1.0

# Risco por trecho (baseline determinístico, SEM validação empírica em nível de via) e roteamento.
# O que não tem base nos dados do projeto está marcado PROVISÓRIO; nenhum desses números foi ajustado
# para "acertar" ocorrências.
risco_trecho:
  # Âncoras de chuva em Porto Alegre: limites INFERIORES observados em dias com bloqueios
  # informados (reports/qa/rain_calibration.json). Abaixo do médio o fator cresce linearmente de 0.
  chuva_medio: {max_1h_mm: 3.5, total_24h_mm: 26.2}
  chuva_alto: {max_1h_mm: 9.0, total_24h_mm: 55.9}
  fator_no_medio: 0.4          # PROVISÓRIO: fator de chuva ao atingir o nível médio (alto = 1.0)
  # Condição antecedente: chuva nas 72 h anteriores à janela de 24 h.
  # Recuo: a água sai da via em poucas horas depois da chuva, mas as janelas de 24 h seguem altas. O fator decai
  # linearmente até zero em `recuo_h` horas sem chuva (hora com menos de `chuva_minima_mm` conta como seca).
  recuo_h: 6                   # PROVISÓRIO
  chuva_minima_mm: 0.5         # PROVISÓRIO
  antecedente_72h_mm: 26.2     # PROVISÓRIO: usa o mesmo limite médio de 24 h
  antecedente_fator: 1.15      # PROVISÓRIO: multiplicador do fator de chuva, limitado a 1
  # O peso do trecho é uma rampa linear sobre o percentil físico: 0 até este corte, 1 no percentil 100. Só os trechos
  # mais suscetíveis carregam peso; sem isso a classe "Alto" cobriria metade da cidade com chuva forte.
  corte_fisico: 85             # PROVISÓRIO: orçamento de atenção, não ajustado a ocorrências
  classes: {atencao: 0.25, alto: 0.6}   # PROVISÓRIO: cortes do escore (fator de chuva x peso); ~5% da malha em atenção com chuva
                                         # no nível médio e ~10% (atenção + alto) com chuva no nível alto
  # Peso mínimo do trecho quando há ocorrência próxima e ainda ativa, por situação.
  piso_ocorrencia: {confirmada: 0.9, reportada: 0.6}   # PROVISÓRIO
  fator_confiabilidade_ocorrencia: {alta: 1.0, media: 0.75, baixa: 0.5}   # PROVISÓRIO
  raio_ocorrencia_m: 100
  # Uma interdição confirmada sem segmentos informados fecha só os segmentos a esta distância do ponto.
  raio_interdicao_m: 30
  validade_ocorrencia_h: 72
  # Confiabilidade do dado de risco: só terreno = 0.5; ocorrência reportada = 0.75; confirmada = 1.
  confiabilidade: {fisico: 0.5, reportada: 0.75, confirmada: 1.0}   # PROVISÓRIO

roteamento:
  # Velocidades de fluxo livre por classe OSM (km/h), sem congestionamento nem semáforos.   PROVISÓRIO
  velocidade_kmh: {motorway: 80, motorway_link: 50, trunk: 60, trunk_link: 40, primary: 40, primary_link: 30,
                   secondary: 35, secondary_link: 25, tertiary: 30, tertiary_link: 25, unclassified: 25,
                   residential: 25, living_street: 10, service: 15, road: 25}
  velocidade_padrao_kmh: 25
  pe_kmh: 4.8
  # Segundos de penalidade por km percorrido com escore de risco 1 e confiabilidade 1 (aversao = 1).
  penalidade_s_por_km_risco: 600   # PROVISÓRIO
  aversoes_candidatas: [1, 3, 10]
  # Rotas distintas compartilham no máximo esta fração do comprimento com as já escolhidas.
  compartilhamento_maximo: 0.7
  snap_maximo_m: 500
