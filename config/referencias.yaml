# Registro único das referências do projeto. Tudo que aparece em docs/referencias_bibliograficas.md e na seção "Referências bibliográficas" da landing sai daqui
# (tools/gerar_referencias.py). Cada campo foi conferido em 26/11/2026 na fonte indicada em "conferido"; nada foi preenchido de memória.
#
# Campos: id, cat (1 a 11; ver CATEGORIAS em tools/gerar_referencias.py), uso (efetiva | experimento | historica | avaliada), tipo (artigo | preprint | software | dataset |
# documento | web), autor (já em formato ABNT, separados por "; "), titulo, subtitulo, periodico, local, editora, ano, versao, vol, num, pag, doi, url, acesso (AAAA-MM-DD, data
# em que o endereço respondeu), verificado (false = o endereço não pôde ser conferido por acesso automatizado), licenca, nota (o que o projeto usa e como), conferido (de onde vieram os
# metadados), cit (chave da citação no texto, opcional: gerada do primeiro autor e do ano).
#
# Regra de autoria (ABNT): até três autores, todos; mais de três, o primeiro seguido de "et al.". Autor ausente ou coletivo: a instituição.
# Licença: só quando há texto verificável; caso contrário "não identificada nesta revisão" ou "a confirmar".

