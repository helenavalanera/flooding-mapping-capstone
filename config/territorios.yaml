# Territórios do produto: o que cada região pode mostrar e fazer. É a ÚNICA fonte de capacidades: a interface lê
# este arquivo (publicado como data/territorios.json) em vez de espalhar condicionais por região.
#
#   capacidades   decisão declarada sobre a funcionalidade: disponivel | parcial | indisponivel
#   cobertura     calculada dos dados (cobertura.py): onde existem dados, e quanto
#   qualidade     calculada dos dados: completude, atualidade e confiabilidade
#
# Nenhuma capacidade de risco por trecho pode ser "disponivel": não há validação (testado em tests/test_cobertura.py).
classificacao:
  # Uma região só é "dados disponíveis" quando TODAS as dimensões abaixo atendem o mínimo. Sem malha mapeada nem
  # registros do S2iD, só resta a meteorologia: "dados insuficientes". Nos demais casos: "cobertura parcial".
  # As dimensões são calculadas por comprimento (km) ou contagem; nenhuma é digitada à mão.
  indice_fisico_minimo: 0.8    # fração do km da malha com índice físico
  vdm_minimo: 0.8              # fração do km da malha com tráfego (VDM) conhecido

territorios:
  rs:
    nome: Rio Grande do Sul
    escala: estadual
    vista: {centro: [-53.2, -30.0], zoom: 6, inclinacao: 50, rumo: 0}
    capacidades:
      limites_territoriais:
        estado: disponivel
        camadas: [municipios]
        nota: Limites municipais do IBGE.
      malha_rodoviaria:
        estado: parcial
        camadas: [rodovias]
        nota: Rodovias estaduais, federais e municipais do DAER. Vias urbanas e vicinais não estão na base.
      meteorologia:
        estado: parcial
        camadas: [risco_municipal]
        nota: Chuva diária e estimativa municipal de 72 h. Não há chuva horária nem previsão por trecho em escala estadual.
      ocorrencias:
        estado: parcial
        camadas: [bloqueios, s2id]
        nota: Registros de decreto do S2iD (municipais, sem geometria, com atraso) e bloqueios ativos da CPRv BM (a coleta não tem histórico anterior ao seu início).
      caracteristicas_fisicas:
        estado: parcial
        camadas: [indice_fisico]
        nota: Índice físico relativo por segmento da malha DAER, sem validação em nível de segmento.
      mobilidade_simulada:
        estado: parcial
        camadas: [trechos_criticos]
        nota: Simulação de fechamento de cada segmento na malha DAER. Vias municipais e urbanas ausentes tornam muitas "pontes" falta de alternativa mapeada.
      relevo_3d:
        estado: disponivel
        camadas: [relevo]
        nota: Elevação pública para visualização; não alimenta nenhum cálculo de risco.
      risco_por_trecho:
        estado: indisponivel
        camadas: [risco_trecho]
        motivo: Não há ocorrências georreferenciadas suficientes nem validação em escala estadual.
      rotas:
        estado: indisponivel
        camadas: [rotas]
        motivo: O roteamento estadual não faz parte desta etapa, e a malha DAER não inclui as vias urbanas.
  poa:
    nome: Porto Alegre
    escala: municipal
    vista: {centro: [-51.22, -30.03], zoom: 12, inclinacao: 60, rumo: 20}
    capacidades:
      limites_territoriais:
        estado: indisponivel
        motivo: O município é uma única unidade; a escala urbana usa a rede de ruas.
      malha_rodoviaria:
        estado: parcial
        camadas: []
        nota: Rede de ruas do OpenStreetMap para carro e a pé. A cobertura do terreno por modal está em Proveniência.
      meteorologia:
        estado: disponivel
        requer_servidor: true
        camadas: []
        nota: Chuva horária recente e prevista para 72 h, uma série para a cidade inteira (grade de cerca de 10 km).
      ocorrencias:
        estado: parcial
        requer_servidor: true
        camadas: [ocorrencias, interdicoes]
        nota: Relatos (reportada) e confirmações de operador. Ainda sem histórico georreferenciado suficiente para modelar.
      caracteristicas_fisicas:
        estado: parcial
        requer_servidor: true
        camadas: []
        nota: Índice físico relativo por trecho (cota, depressão local, proximidade da água, fluxo, declividade), visível ao selecionar um trecho; não há camada com todas as ruas. Trechos só de pedestres não têm índice.
      mobilidade_simulada:
        estado: disponivel
        requer_servidor: true
        camadas: []
        nota: Desvio simulado ao fechar um trecho, para carro e a pé.
      relevo_3d:
        estado: disponivel
        camadas: [relevo]
        nota: Elevação pública para visualização; o relevo urbano é plano e o exagero vertical é declarado.
      risco_por_trecho:
        estado: parcial
        requer_servidor: true
        camadas: [risco_trecho]
        nota: Baseline determinístico e transparente, sem validação contra alagamentos em vias.
      rotas:
        estado: parcial
        requer_servidor: true
        camadas: [rotas]
        nota: Carro e a pé, com penalidade de risco estimado no horário de passagem. Sem ônibus nem congestionamento.
