name: coletor-crbm

# Arquiva os bloqueios ativos das rodovias do RS (CPRv BM) no Cloudflare R2.
# Só grava quando algo muda. Detalhes e controle de custo: docs/coletor_crbm.md

on:
  schedule:
    # Minutos 7 e 37 evitam o congestionamento do início de cada hora no GitHub.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Uma execução por vez; nunca cancelar uma que esteja gravando.
concurrency:
  group: coletor-crbm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    # Só no repositório original (não em forks) e só se não estiver desligado.
    # Interruptor: Settings > Secrets and variables > Actions > Variables:
    # defina COLETOR_ATIVO = false para pausar sem editar código.
    if: github.repository == 'helenavalanera/flooding-mapping-capstone' && vars.COLETOR_ATIVO != 'false'
    # Sistema fixo: "ubuntu-latest" migra para o Ubuntu 26 e pode mudar o Python disponível.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Ações fixadas pelo hash do commit (o job tem segredos de escrita no R2).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-coletor.txt

      - name: Instalar dependências mínimas
        run: pip install -r requirements-coletor.txt

      - name: Coletar e arquivar mudanças
        # O repositório é público: o log só mostra contadores, nunca valores.
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
        run: python -m flooding_mapping.collector
