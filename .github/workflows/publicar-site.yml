name: publicar-site

# Monta o site estático de Porto Alegre (landing, painel de análise e simulador; sem modelo, previsão nem bloqueios) e o
# publica no GitHub Pages SEM fazer commits. A montagem de duas escalas (RS, com previsão de 72 h e bloqueios) está arquivada
# em src/flooding_mapping/app/arquivo/site_estadual.py. Detalhes e pré-requisitos: docs/publicacao_pages_releases.md
# Só dispara manualmente: o site é estático e não precisa ser remontado de tempos em tempos.

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  construir:
    # Adesão: só roda no repositório original e depois que SITE_ATIVO = true for definida em
    # Settings > Secrets and variables > Actions > Variables (ver docs/publicacao_pages_releases.md). Para pausar: remova a variável.
    if: github.repository == 'helenavalanera/flooding-mapping-capstone' && vars.SITE_ATIVO == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Instalar dependências
        run: pip install -r requirements-site.txt

      # Sem segredos nem rede: só copia a interface estática. As camadas derivadas e o mapa-base são publicados à parte (docs/publicacao_pages_releases.md).
      - name: Montar o site
        env:
          PYTHONPATH: src
        run: python -m flooding_mapping.app.build --out site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
