[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flooding-mapping"
version = "0.1.0"
description = "Mobilidade urbana perdida com chuvas de até 45 mm em Porto Alegre quando trechos alagáveis são interditados"
readme = "README.md"
license = "MIT"
authors = [{ name = "Helena de Oliveira Valanera", email = "helena.valanera@gmail.com" }]
# r5py/pyrosm restringem pyproj a versões sem wheels para cp313/cp314.
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.1,<1.2",
    "shapely>=2.1,<3",
    "pyproj>=3.6,<3.7",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "networkx>=3.4",
    "pyrosm>=0.6.2",
    "r5py>=1.1,<1.2",
    "matplotlib>=3.9",
    "osmium>=4,<5",
    "scikit-learn>=1.5",
    "rasterio>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
